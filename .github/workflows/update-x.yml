name: Update DREGG X feed

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: node scripts/fetch.mjs

      - name: Commit feed
        run: |
          git config user.name "dregg-x-feed"
          git config user.email "actions@users.noreply.github.com"
          git add data/x-posts.json
          git diff --cached --quiet || git commit -m "Update X feed"
          git push
